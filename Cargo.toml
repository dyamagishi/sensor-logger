[package]
name = "home-sensors"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "home-sensors"
path = "rust/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "net", "time", "sync", "signal"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
